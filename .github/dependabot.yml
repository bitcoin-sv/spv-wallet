# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep GitHub Actions updated with the latest security patches and features.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Tuesday 11:00 America/New_York) – align with typical maintenance windows.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected main branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI checks before merging.
#   • Cooldown – new releases wait 3 days before a version‑update PR opens
#     (Go modules: patch 3 / minor 7 / major 14 days); first‑party and trusted
#     publishers are excluded. Security updates are never delayed.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/models"
      - "/regression_tests"
      - "/api/manualtests"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      exclude:
        - "github.com/bitcoinschema/*"
        - "github.com/bsv-blockchain/*"
        - "github.com/mrz1836/*"
        - "golang.org/x/*"

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude:
        - "actions/*"
        - "github/*"
        - "gitleaks/*"
        - "ossf/*"

  # ──────────────────────────────────────────────────────────────
  # 3. DevContainer (devcontainer.json : base image + features)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:30"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      devcontainer-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "devcontainer"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude:
        - "ghcr.io/devcontainers/features/*"


  # ──────────────────────────────────────────────────────────────
  # 4. Dockerfiles (any Dockerfile in repo root or sub‑dirs)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:45"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      dockerfiles-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude:
        - "golang"

  # ──────────────────────────────────────────────────────────────
  # 5. Release Dockerfile (release/Dockerfile)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/release"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "12:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      dockerfiles-release-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
      exclude:
        - "golang"

  # ──────────────────────────────────────────────────────────────
  # 6. Docker Compose (docker-compose.yml)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "12:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      docker-compose-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "docker-compose"]
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 3
